<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Blog by Killian Chandeze — insights on software engineering, DevOps, and technology trends." />
    <meta name="theme-color" content="#0f172a" />
    <title>Blog — Killian Chandeze</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/additions.css" />
    <link rel="stylesheet" href="assets/css/header-icons.css" />
    <link rel="stylesheet" href="assets/css/components/language-selector.css" />
    <link rel="stylesheet" href="assets/css/blog.css" />

    <!-- Favicons -->
    <link rel="icon" href="assets/img/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon" />

    <!-- Open Graph -->
    <meta property="og:title" content="Killian Chandeze — Blog" />
    <meta property="og:description" content="Technical insights and thoughts on software engineering." />
    <meta property="og:type" content="website" />
  </head>

  <body data-theme="dark">
    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <main id="top">
      <!-- Compact Blog Header -->
      <section class="section container" style="padding-top: 2rem; padding-bottom: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <h1 style="margin: 0; font-size: 2rem; font-weight: 700;">Blog</h1>
          
          <!-- Blog Search -->
          <div class="blog-search" style="margin: 0;">
            <input 
              type="text" 
              id="blog-search" 
              class="blog-search-input" 
              placeholder="Search articles..."
              aria-label="Search articles"
              style="max-width: 300px;"
            />
          </div>
        </div>
        
        <!-- Blog Stats and Filters -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
          <div id="blog-stats" class="blog-stats" style="margin: 0;"></div>
          <div id="blog-filters" class="blog-filters" style="margin: 0;"></div>
        </div>
      </section>

      <section class="section container" style="padding-top: 0;">
        <!-- Blog Grid -->
        <div id="blog-grid" class="blog-grid">
          <div class="blog-loading">
            Loading articles...
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="assets/js/components.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/shared/markdown-parser.js"></script>
    <script src="assets/js/articles-list.js"></script>
    <script src="assets/js/blog.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
